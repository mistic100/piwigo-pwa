{combine_script id='common' load='footer' path='admin/themes/default/js/common.js'}

<div class="titrePage">
  <h2>PWA Backend</h2>
</div>

<form class="properties" method="post" action="{$PWA_BACKEND_ADMIN}">
  <div id="configContent">
    <fieldset class="mainConf">
      <legend>
        <span class="icon-cog icon-purple"></span>
        {'Configuration'|translate}
      </legend>

      <ul>
        <li>
          <label class="font-checkbox">
            <span class="icon-check"></span>
            <input type="checkbox" name="add_cors_headers" {if ($config.add_cors_headers)}checked="checked"{/if}>
            Add CORS headers to API services
            <span class="icon-help-circled tiptip" title="Adds the &quot;Access-Control-Allow-Origin&quot; HTTP header with the specified frontend URL to all API responses." style="cursor:help"></span>
          </label>
        </li>

        <li>
          <label for="frontend_url">Frontend URL</label>
          <br>
          <input type="text" id="frontend_url" name="frontend_url" size="50" value="{$config.frontend_url}" required>
        </li>
      </ul>
    </fieldset>
  </div>

  <div class="savebar-footer">
    <div class="savebar-footer-start"></div>
    <div class="savebar-footer-end">
      <div class="savebar-footer-block">
        <button class="buttonLike" type="submit" name="submit">
          <i class="icon-floppy"></i>
          {'Save Settings'|translate}
        </button>
      </div>
    </div>
  </div>
</form>
